[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-web"
version = "1.0.0"
description = "Universal live web search, deep HTML table scraper, desktop GUI proxy daemon, and MCP server for Ollama on Linux, macOS, and Windows."
readme = "README.md"
authors = [
    { name = "Ajarn Spencer Littlewood", email = "ajarnspencer@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "ddgs>=1.0.0",
]

[project.optional-dependencies]
proxy = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
speak = [
    "ollama-speak>=1.0.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "ollama-speak>=1.0.0",
]

[project.scripts]
ollama-web = "ollama_web.cli:main"
oweb = "ollama_web.cli:main"

[project.urls]
Homepage = "https://github.com/AjarnSpencer/ollama-web"
Repository = "https://github.com/AjarnSpencer/ollama-web"
Issues = "https://github.com/AjarnSpencer/ollama-web/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_web"]
